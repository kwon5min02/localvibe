[importlinter]
root_package = app
include_external_packages = True

[importlinter:contract:no-cross-module-import]
name = Modules must not cross-import each other
type = forbidden
source_modules =
    app.modules.auth
    app.modules.regions
    app.modules.user_data
    app.modules.data
forbidden_modules =
    app.modules.auth
    app.modules.regions
    app.modules.search
    app.modules.chat
    app.modules.content
    app.modules.user_data
    app.modules.data
ignore_imports =
    app -> app.main

[importlinter:contract:routes-use-modules]
name = Routes must not import from app.services
type = forbidden
source_modules =
    app.api.routes
forbidden_modules =
    app.services
ignore_imports =
    app -> app.main
